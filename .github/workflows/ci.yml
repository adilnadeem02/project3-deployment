name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/project3-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/project3-frontend:${{ github.sha }}

      - name: Update K8s Manifests
        run: |
          # Replace the old image tag with the new commit hash tag
          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/project3-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/project3-backend:${{ github.sha }}|g" k8s/backend.yaml
          sed -i "s|image: ${{ secrets.DOCKER_USERNAME }}/project3-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/project3-frontend:${{ github.sha }}|g" k8s/frontend.yaml
          
          # Commit the updated files back to the repository
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add k8s/
          git commit -m "Automated update K8s image tags to ${{ github.sha }}"
          git push